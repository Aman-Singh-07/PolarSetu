version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: polarsetu_db
    environment:
      POSTGRES_USER: polarsetu
      POSTGRES_PASSWORD: ps
      POSTGRES_DB: PolarSetu
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount migrations so they run automatically when the DB initializes
      - ./backend/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata:
